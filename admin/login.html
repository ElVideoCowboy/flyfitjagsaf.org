<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · Fly Fit Jags</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--card:#1a1a1a;--gold:#c69649;--gold-lift:#d9ab5f;--muted:#bfbfbf;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--black);color:#fff;font-family:"Inter",system-ui,sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:2rem;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:2.6rem;width:100%;max-width:420px}
.mark{
  width:56px;height:56px;border-radius:16px;background:var(--gold);color:#111;display:grid;place-items:center;
  font-family:"Poppins",sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:-.04em;margin-bottom:1.5rem;
}
h1{font-family:"Poppins",sans-serif;font-weight:900;font-size:1.6rem;letter-spacing:-.02em;margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.94rem;margin-bottom:2rem}
label{
  display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:.7rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;
}
input{
  width:100%;background:#0b0b0b;border:1px solid #2e2e2e;border-radius:12px;
  padding:.9rem 1rem;font-family:inherit;font-size:1rem;color:#fff;margin-bottom:1.3rem;
}
input:focus{outline:none;border-color:var(--gold)}
button{
  width:100%;background:var(--gold);color:#111;border:0;border-radius:999px;
  padding:1rem;font-family:"Poppins",sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;
}
button:hover{background:var(--gold-lift)}
button:disabled{opacity:.6;cursor:default}
.status{min-height:1.4em;margin-top:1rem;font-size:.9rem;color:#ff8b7a;text-align:center}
.back{display:block;text-align:center;margin-top:1.6rem;color:#7e7e7e;font-size:.85rem;text-decoration:none}
.back:hover{color:var(--gold)}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="mark">FFJ</div>
    <h1>Admin Console</h1>
    <p class="sub">Sign in to edit the website.</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="submitBtn">Sign In</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a class="back" href="/">&larr; Back to the website</a>
  </form>

<script>
const form = document.getElementById('loginForm');
const statusEl = document.getElementById('status');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/admin/';
      return;
    }
    statusEl.textContent = data.error || 'Sign in failed.';
  } catch (err) {
    statusEl.textContent = 'Could not reach the server.';
  }
  btn.disabled = false;
  btn.textContent = 'Sign In';
});
</script>
</body>
</html>
